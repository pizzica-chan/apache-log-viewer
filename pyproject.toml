[project]
name = "apache-log-viewer"
version = "0.1.0"
description = "Apache アクセスログを時系列統合・検索する障害調査ツール"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
alv = "alv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["alv*"]

[tool.setuptools.package-data]
alv = ["static/*"]
