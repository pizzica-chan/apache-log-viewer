<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apache Log Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Apache Log Viewer</h1>
    <p id="meta">読み込み中...</p>
  </header>

  <section class="source-dir">
    <label>
      ログディレクトリ
      <div class="dir-input">
        <input id="log-dir" placeholder="例: C:\logs\apache">
        <button id="browse" type="button">参照...</button>
        <button id="load-dir" type="button">読み込み</button>
      </div>
    </label>
    <p id="file-list" class="file-list"></p>
  </section>

  <section class="filters">
    <label>
      ステータス
      <input id="status" placeholder="500 / 4xx / 500,502">
    </label>
    <label>
      パス (正規表現)
      <input id="path" placeholder="/api/">
    </label>
    <label>
      メソッド
      <input id="method" placeholder="GET">
    </label>
    <label>
      クライアント IP
      <input id="host" placeholder="192.168 (XFF 含む)">
    </label>
    <label>
      開始
      <input id="since" type="datetime-local">
    </label>
    <label>
      終了
      <input id="until" type="datetime-local">
    </label>
    <label>
      全文検索
      <input id="grep" placeholder="error">
    </label>
    <label>
      ソースファイル (正規表現)
      <input id="source" placeholder="access_log">
    </label>
    <button id="search">検索</button>
    <button id="reset" type="button">リセット</button>
  </section>

  <section class="toolbar">
    <span id="result-count"></span>
    <div class="pager">
      <button id="prev" disabled>前へ</button>
      <span id="page-info"></span>
      <button id="next" disabled>次へ</button>
    </div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>時刻</th>
          <th>Status</th>
          <th>Method</th>
          <th>Path</th>
          <th>Client</th>
          <th>Remote</th>
          <th>Bytes</th>
          <th>Source</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <dialog id="browse-dialog">
    <form method="dialog" class="browse-form">
      <h2>ディレクトリを選択</h2>
      <p id="browse-current" class="browse-current"></p>
      <ul id="browse-list" class="browse-list"></ul>
      <div class="browse-actions">
        <button id="browse-up" type="button">上へ</button>
        <button id="browse-select" type="button" value="select">このディレクトリを選択</button>
        <button type="submit" value="cancel">キャンセル</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail">
    <form method="dialog">
      <pre id="detail-body"></pre>
      <button>閉じる</button>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
